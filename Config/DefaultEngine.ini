[/Script/Engine.AudioSettings]
; VOIP capture/encode rate. UVOIPStatics::GetVoiceSampleRate falls through to Low16000Hz when
; this is unset, which sounds like a telephone. Normal24000Hz is the only higher option the
; engine accepts — anything else silently falls back to 16 kHz. Read once and cached, so
; changing it needs a restart, not just a repackage.
VoiPSampleRate=Normal24000Hz

[SystemSettings]
; Open-mic tuning. Transmission is gated by input level rather than a key, so these two decide
; whether normal speech gets through. The engine default noise gate (0.08) is aggressive enough
; to silence quiet talkers entirely, which reads as "voice is broken" — hence the lower value.
; Both are plain CVars: retune live in the console before changing them here.
voice.SilenceDetectionThreshold=0.02
voice.MicNoiseGateThreshold=0.01

; Jitter buffer. Raised from the engine default of 0.3 because Steam's relay adds variable
; latency that the default does not absorb, and an underrun is heard as choppy audio. 0.5 fixed
; the choppiness but was audibly laggy; 0.4 is the current compromise. Raise it again if dropouts
; come back. Cached at startup, so a change here needs a repackage, not just a restart.
voice.JitterBufferDelay=0.4


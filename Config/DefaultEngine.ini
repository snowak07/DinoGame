; --- Peer-to-peer networking -------------------------------------------------
; Route game traffic over Steam's relay network instead of raw IP, so hosts do
; not need port forwarding and their IP is never exposed to joining players.
; BaseEngine.ini already defines all three DefNames, and "+" will not overwrite
; an existing entry, so the array has to be cleared and fully re-declared.
; DriverClassNameFallback matters: USteamSocketsNetDriver::IsAvailable() returns
; false when Steam is not initialised, which is the case in PIE. The engine then
; falls back to IpNetDriver automatically, so editor multiplayer testing keeps
; working without touching this config.
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/SteamSockets.SteamSocketsNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="BeaconNetDriver",DriverClassName="/Script/SteamSockets.SteamSocketsNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="DemoNetDriver",DriverClassName="/Script/Engine.DemoNetDriver",DriverClassNameFallback="/Script/Engine.DemoNetDriver")


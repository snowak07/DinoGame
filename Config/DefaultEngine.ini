; --- Navigation ---------------------------------------------------------------
; Dynamic rather than the engine default of Static. A World Partition level streams
; in around the player, so a navmesh baked once at edit time describes geometry that
; may not be loaded. Dynamic also covers anything spawned or moved at runtime.
[/Script/NavigationSystem.NavigationData]
RuntimeGeneration=Dynamic

; Whole-volume generation for now, deliberately, not invoker-only.
;
; Invoker-only is the setting that scales: on a large streamed map it is the difference
; between a few navmesh tiles and tens of thousands. But invokers only exist at runtime,
; so with it enabled there is no navmesh in the editor viewport at all — you cannot see
; where creatures can walk while building a level, and "press P, see nothing" looks
; exactly like a broken setup.
;
; TODO(ai): switch bGenerateNavigationOnlyAroundNavigationInvokers to True once the map
; is large enough that whole-volume generation is slow. ADinoCreature already carries a
; UNavigationInvokerComponent, and bAddPlayersToGenerationSeeds (engine default true)
; makes player pawns seeds, so the switch is one line here and nothing else.
[/Script/NavigationSystem.NavigationSystemV1]
bAutoCreateNavigationData=True
bGenerateNavigationOnlyAroundNavigationInvokers=False

; One navmesh per creature size. Each creature is matched to one automatically, from its
; capsule: UNavigationSystemV1::GetNavDataForProps picks the smallest agent the capsule
; fits inside (the radius and height here against the capsule's scaled radius and full
; height). So an agent sized exactly to a capsule is an exact match, and a creature
; wider than every agent falls back to the widest - and scrapes walls. DinoAICheck
; reports which navmesh each creature got.
;
; One navmesh per agent means generation time and memory scale with this list: keep it
; to a few sizes, not one per species.
;
; Our own nav queries (idle wander points, fallback search points) must ask for the
; creature's navmesh explicitly - ADinoAIControllerBase::GetCreatureNavData. Without it
; the engine answers from the first agent's navmesh, and a raptor would only ever pick
; destinations a T-Rex can reach. Path following and EQS already pick the right one.
;
; TRex first: anything that does not name a navmesh gets the first one listed.
; Colours are what P draws each navmesh in: TRex the engine's usual green, Raptor blue. Avoid
; red - the editor already uses it for tiles being rebuilt.
; Raptor: capsule radius 60, half height 100. Step height matches the character
; movement default of 45; the T-Rex keeps the navmesh's 60 below.
+SupportedAgents=(Name="TRex",Color=(R=140,G=255,B=0,A=164),DefaultQueryExtent=(X=50.0,Y=50.0,Z=250.0),NavDataClass="/Script/NavigationSystem.RecastNavMesh",AgentRadius=140.0,AgentHeight=400.0)
+SupportedAgents=(Name="Raptor",Color=(R=30,G=120,B=200,A=164),DefaultQueryExtent=(X=50.0,Y=50.0,Z=250.0),NavDataClass="/Script/NavigationSystem.RecastNavMesh",AgentRadius=60.0,AgentHeight=200.0,AgentStepHeight=45.0)

; Shared by every agent's navmesh. Radius and height come from each agent above.
[/Script/NavigationSystem.RecastNavMesh]
AgentMaxStepHeight=60.f
AgentMaxSlope=44.f


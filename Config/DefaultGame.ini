[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=25A2E936439E12F7B8D1C59D446E6A5E
ProjectName=DinoGame

[ConsoleVariables]
CommonUI.CheckKeyboardFocusAndParentage=1
CommonUI.DisallowUserFocusedWidgetForPendingFocusRecipient=1
CommonUI.FallbackToDesiredOnAutoRestoreFailure=1

[/Script/UnrealEd.ProjectPackagingSettings]
; Every map the game can travel to has to be listed. The cooker packages only the default map
; and what it references, and nothing references Lvl_FirstPerson - hosting reaches it by
; ServerTravel to a path. Leave it off and the package builds fine, then hosting fails with
; "TickWorldTravel failed ... Failed to load" and drops straight back to the main menu.
+MapsToCook=(FilePath="/Game/FirstPerson/Lvl_MainMenu")
+MapsToCook=(FilePath="/Game/FirstPerson/Lvl_FirstPerson")
+MapsToCook=(FilePath="/Game/FirstPerson/Forest")

[/Script/DinoGame.DinoSessionSubsystem]
; Where the main menu's Host button takes everyone. Must also be listed under MapsToCook above.
GameplayMap=/Game/FirstPerson/Forest

[/Script/Engine.GameSession]
; Open mic, not push-to-talk. The engine default (BaseGame.ini) is true, and every time the server
; sets a player up - joining, and again on every seamless round restart - it calls
; ClientEnableNetworkVoice(!bRequiresPushToTalk) on them. With true that switches every mic off at
; each restart, and our open-mic code (ADinoPlayerController::EnableOpenMic) does not run again,
; because a seamless restart keeps the same controller. Voice went dead after every restart in the
; Oct 7 playtest. PIE never showed it: there a restart is a full reconnect, which re-runs our code.
bRequiresPushToTalk=False
